<!DOCTYPE html>
<html>

<head>

    <title>Members - ECOFIN CREDIT</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="sidebar">

        <h2>

            <span class="main-title">
                ECOFIN CREDIT
            </span>

            <span class="sub-title">
                Finacle by Arambh
            </span>

        </h2>

        <a href="../dashboard.html">Dashboard</a>
        <a href="members.html">Members</a>

    </div>

    <div class="main">

        <div class="topbar">

            <h1>Member Registration</h1>

        </div>

        <div class="form-container">

            <h2>Member Details</h2>

            <br>

            <!-- MEMBER NUMBER -->

            <div class="form-group">
                <label>Member Number</label>
                <input type="text" id="memberNumber" readonly>
            </div>

            <hr><br>

            <h3>Personal Details</h3>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName">
            </div>

            <div class="form-group">
                <label>Father / Husband Name</label>
                <input type="text" id="fatherName">
            </div>

            <div class="form-group">

                <label>Gender</label>

                <select id="gender">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>

            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" id="dob">
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" id="age">
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="text" id="mobile">
            </div>

            <div class="form-group">
                <label>Alternate Mobile</label>
                <input type="text" id="alternateMobile">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email">
            </div>

            <hr><br>

            <h3>KYC Details</h3>

            <div class="form-group">
                <label>Aadhaar Number</label>
                <input type="text" id="aadhaar">
            </div>

            <div class="form-group">
                <label>PAN Number</label>
                <input type="text" id="pan">
            </div>

            <hr><br>

            <h3>Occupation Details</h3>

            <div class="form-group">
                <label>Occupation</label>
                <input type="text" id="occupation">
            </div>

            <div class="form-group">
                <label>Monthly Income</label>
                <input type="number" id="monthlyIncome">
            </div>

            <hr><br>

            <h3>Address Details</h3>

            <div class="form-group">
                <label>Address</label>
                <textarea id="address"></textarea>
            </div>

            <div class="form-group">
                <label>City</label>
                <input type="text" id="city">
            </div>

            <div class="form-group">
                <label>District</label>
                <input type="text" id="district">
            </div>

            <div class="form-group">
                <label>State</label>
                <input type="text" id="state">
            </div>

            <div class="form-group">
                <label>PIN Code</label>
                <input type="text" id="pinCode">
            </div>

            <hr><br>

            <h3>Nominee Details</h3>

            <div class="form-group">
                <label>Nominee Name</label>
                <input type="text" id="nomineeName">
            </div>

            <div class="form-group">
                <label>Nominee Relation</label>
                <input type="text" id="nomineeRelation">
            </div>

            <div class="form-group">
                <label>Nominee Mobile</label>
                <input type="text" id="nomineeMobile">
            </div>

            <hr><br>

            <h3>Document Uploads</h3>

            <div class="form-group">
                <label>Photo Upload</label>
                <input type="file" id="photo">
            </div>

            <div class="form-group">
                <label>Aadhaar Front Upload</label>
                <input type="file" id="aadhaarFront">
            </div>

            <div class="form-group">
                <label>Aadhaar Back Upload</label>
                <input type="file" id="aadhaarBack">
            </div>

            <div class="form-group">
                <label>PAN Card Upload</label>
                <input type="file" id="panCard">
            </div>

            <div class="form-group">
                <label>Signature Upload</label>
                <input type="file" id="signature">
            </div>

            <hr><br>

            <h3>Status</h3>

            <div class="form-group">

                <label>Member Status</label>

                <select id="status">

                    <option value="Active">Active</option>

                    <option value="Inactive">Inactive</option>

                    <option value="Closed">Closed</option>

                </select>

            </div>

            <button onclick="saveMember()">
                Save Member
            </button>

        </div>

    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/members.js"></script>

</body>

</html>
