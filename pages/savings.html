<!DOCTYPE html>
<html>
<head>
  <title>Savings Accounts - ECOFIN</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .container { padding: 20px; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }
    input, select {
      padding: 10px;
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    button {
      padding: 12px 25px;
      cursor: pointer;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
    }
    button:disabled {
      background-color: #6c757d;
    }
    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      background-color: #d4edda;
      border: 1px solid #c3e6cb;
      border-radius: 4px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>
      <span class="main-title">ECOFIN CREDIT</span>
      <span class="sub-title">Finacle by Arambh</span>
    </h2>
    <a href="../dashboard.html">Dashboard</a>
    <a href="members.html">Members</a>
    <a href="savings.html">Savings Accounts</a>
  </div>

  <div class="main">
    <h1>Savings Deposit</h1>
    <div class="container">
      <div class="form-grid">
        <input type="text" id="memberNumber" placeholder="Member Number (e.g. ECO00001)">
        <input type="number" id="amount" placeholder="Deposit Amount">
        <select id="paymentMode">
          <option value="Cash">Cash</option>
          <option value="Bank Transfer">Bank Transfer</option>
          <option value="UPI">UPI</option>
          <option value="Cheque">Cheque</option>
        </select>
        <input type="text" id="remarks" placeholder="Remarks (Optional)">
      </div>
      <br>
      <button onclick="depositSavings()">Deposit Now</button>
      
      <div id="result"></div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/savings.js"></script>
</body>
</html>
